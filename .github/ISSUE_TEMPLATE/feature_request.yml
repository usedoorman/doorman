name: Feature request
description: Something you'd like Doorman to do
labels: ["feature request"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What keeps getting in your way?
      description: The situation you're in, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Doorman to do?
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Which agents and apps you use, and how many displays.
